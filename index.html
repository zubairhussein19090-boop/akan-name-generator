<!DOCTYPE html>
<html>

<head>
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Akan Name Generator</h1>

        <p>
            Enter your birthday and gender to discover your Akan name.
            Akan names come from Ghanaian culture where names are based on the day you were born.
                    Find Yours
        </p>


        <form id="akanForm">

            <label>Date of Birth:</label>

            <input type="date" id="birthdate">


            <label>Gender:</label>

            <div>
                <input type="radio" name="gender" value="male">
                Male

                <input type="radio" name="gender" value="female">
                Female
            </div>


            <button type="submit">
                Generate Name
            </button>


        </form>


        <h2 id="result"></h2>


    </div>


    <script src="script.js"></script>

</body>

</html>
